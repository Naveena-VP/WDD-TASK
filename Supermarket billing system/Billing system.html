<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Supermarket Billing System</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3e8ff;
        }

        .container {
            width: 800px;
            max-width: 92%;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: auto;
            background: #6a1b9a;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 75px;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #6a1b9a;
            margin-top: 20px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #6a1b9a;
            border-bottom: 2px solid #d8b4e8;
            padding-bottom: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #6a1b9a;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row div {
            flex: 1;
        }

        .product-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 10px;
        }

        .product-title {
            font-weight: bold;
            color: #555;
            margin-top: 18px;
        }

        .info {
            margin-top: 20px;
            padding: 13px;
            background: #faf3ff;
            border-left: 4px solid #6a1b9a;
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #6a1b9a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4a116d;
        }

        #error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            border-radius: 6px;
            line-height: 1.7;
        }

        @media(max-width:600px) {

            .row {
                display: block;
            }

            .product-row {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="icon">
        $
    </div>


    <h1>
        Supermarket Billing System
    </h1>


    <p class="subtitle">
        Enter customer and product details to generate bill
    </p>


    <form id="billingForm">


        <!-- Customer Information -->

        <div class="section">

            <h2>
                Customer Information
            </h2>


            <div class="row">

                <div>

                    <label>
                        Customer Name
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter customer name"
                    >

                </div>


                <div>

                    <label>
                        Customer Mobile
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter mobile number"
                    >

                </div>

            </div>


            <label>
                Bill Date
            </label>

            <input
                type="date"
                id="billDate"
            >

        </div>


        <!-- Product Information -->

        <div class="section">

            <h2>
                Product Details
            </h2>


            <div class="product-row product-title">

                <div>
                    Product
                </div>

                <div>
                    Quantity
                </div>

                <div>
                    Price (₹)
                </div>

            </div>


            <!-- Product 1 -->

            <div class="product-row">

                <input
                    type="text"
                    id="product1"
                    placeholder="Product name"
                >

                <input
                    type="number"
                    id="quantity1"
                    min="0"
                    placeholder="Qty"
                >

                <input
                    type="number"
                    id="price1"
                    min="0"
                    placeholder="Price"
                >

            </div>


            <!-- Product 2 -->

            <div class="product-row">

                <input
                    type="text"
                    id="product2"
                    placeholder="Product name"
                >

                <input
                    type="number"
                    id="quantity2"
                    min="0"
                    placeholder="Qty"
                >

                <input
                    type="number"
                    id="price2"
                    min="0"
                    placeholder="Price"
                >

            </div>


            <!-- Product 3 -->

            <div class="product-row">

                <input
                    type="text"
                    id="product3"
                    placeholder="Product name"
                >

                <input
                    type="number"
                    id="quantity3"
                    min="0"
                    placeholder="Qty"
                >

                <input
                    type="number"
                    id="price3"
                    min="0"
                    placeholder="Price"
                >

            </div>


            <!-- Product 4 -->

            <div class="product-row">

                <input
                    type="text"
                    id="product4"
                    placeholder="Product name"
                >

                <input
                    type="number"
                    id="quantity4"
                    min="0"
                    placeholder="Qty"
                >

                <input
                    type="number"
                    id="price4"
                    min="0"
                    placeholder="Price"
                >

            </div>


            <!-- Product 5 -->

            <div class="product-row">

                <input
                    type="text"
                    id="product5"
                    placeholder="Product name"
                >

                <input
                    type="number"
                    id="quantity5"
                    min="0"
                    placeholder="Qty"
                >

                <input
                    type="number"
                    id="price5"
                    min="0"
                    placeholder="Price"
                >

            </div>


            <div class="info">

                <strong>
                    Billing Information
                </strong>

                <br>

                Enter product name, quantity and price.
                The system will automatically calculate
                subtotal, discount, GST and final bill amount.

            </div>

        </div>


        <button type="submit">
            Generate Bill
        </button>


    </form>


    <div id="error"></div>


</div>


<script>


document.getElementById("billingForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    let customerName =
        document.getElementById("customerName")
        .value.trim();


    let mobile =
        document.getElementById("mobile")
        .value.trim();


    let billDate =
        document.getElementById("billDate")
        .value;


    let errors = [];


    if (customerName === "") {

        errors.push(
            "Enter customer name"
        );

    }


    if (mobile === "") {

        errors.push(
            "Enter customer mobile number"
        );

    }


    if (billDate === "") {

        errors.push(
            "Select bill date"
        );

    }


    let products = [];


    let subtotal = 0;


    for (let i = 1; i <= 5; i++) {


        let product =
            document.getElementById(
                "product" + i
            ).value.trim();


        let quantity =
            Number(
                document.getElementById(
                    "quantity" + i
                ).value
            );


        let price =
            Number(
                document.getElementById(
                    "price" + i
                ).value
            );


        if (product !== "") {


            if (
                quantity <= 0 ||
                price <= 0
            ) {

                errors.push(
                    "Enter valid quantity and price for " +
                    product
                );

            }


            let amount =
                quantity * price;


            subtotal += amount;


            products.push({

                name: product,

                quantity: quantity,

                price: price,

                amount: amount

            });

        }

    }


    if (products.length === 0) {

        errors.push(
            "Enter at least one product"
        );

    }


    let errorBox =
        document.getElementById("error");


    if (errors.length > 0) {

        errorBox.style.display = "block";

        errorBox.innerHTML =
            "<strong>Please correct the following:</strong>" +
            "<br><br>" +
            errors.join("<br>");

        return;

    }


    errorBox.style.display = "none";


    /*
       Discount

       If subtotal >= ₹5000 → 10%
       If subtotal >= ₹2000 → 5%
       Otherwise → 0%
    */

    let discountRate = 0;


    if (subtotal >= 5000) {

        discountRate = 10;

    }
    else if (subtotal >= 2000) {

        discountRate = 5;

    }


    let discount =
        subtotal * discountRate / 100;


    let amountAfterDiscount =
        subtotal - discount;


    /*
       GST = 5%
    */

    let gst =
        amountAfterDiscount * 5 / 100;


    let finalAmount =
        amountAfterDiscount + gst;


    /*
       Generate Bill Number
    */

    let billNumber =
        "BILL" +
        Math.floor(
            100000 +
            Math.random() * 900000
        );


    /*
       Store Data
    */

    let billData = {

        billNumber:
            billNumber,

        customerName:
            customerName,

        mobile:
            mobile,

        billDate:
            billDate,

        products:
            products,

        subtotal:
            subtotal,

        discountRate:
            discountRate,

        discount:
            discount,

        gst:
            gst,

        finalAmount:
            finalAmount

    };


    sessionStorage.setItem(
        "supermarketBill",
        JSON.stringify(billData)
    );


    /*
       Move to Page 2
    */

    window.location.href =
        "supermarket-billing-success.html";

});


</script>


</body>

</html>
