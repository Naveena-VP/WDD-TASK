<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Application System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3e5f5;
        }

        .container {
            width: 420px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.20);
        }

        h2 {
            text-align: center;
            color: #6a1b9a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 14px;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #bbb;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 70px;
            resize: none;
        }

        .gender {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .gender label {
            font-weight: normal;
            margin-top: 0;
        }

        .gender input {
            width: auto;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 9px 20px;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4a126b;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.7;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Admission Application System</h2>

        <form id="admissionForm">

            <label>Applicant Name</label>
            <input type="text" id="name"
                   placeholder="Enter applicant name">

            <label>Email</label>
            <input type="email" id="email"
                   placeholder="Enter email">

            <label>Phone</label>
            <input type="tel" id="phone"
                   placeholder="Enter phone number">

            <label>Date of Birth</label>
            <input type="date" id="dob">

            <label>Course</label>
            <select id="course">
                <option value="">Select Course</option>
                <option value="B.Com">B.Com</option>
                <option value="B.Sc Computer Science">
                    B.Sc Computer Science
                </option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="BA English">BA English</option>
            </select>

            <label>Gender</label>

            <div class="gender">

                <label>
                    <input type="radio"
                           name="gender"
                           value="Male">
                    Male
                </label>

                <label>
                    <input type="radio"
                           name="gender"
                           value="Female">
                    Female
                </label>

            </div>

            <label>Address</label>
            <textarea id="address"
                      placeholder="Enter your address"></textarea>

            <label>Percentage / Marks</label>
            <input type="number"
                   id="marks"
                   placeholder="Enter percentage"
                   min="0"
                   max="100">

            <button type="submit">
                Submit Application
            </button>

        </form>

        <div id="message"></div>

    </div>


    <script>

        document.getElementById("admissionForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let name =
                document.getElementById("name").value.trim();

            let email =
                document.getElementById("email").value.trim();

            let phone =
                document.getElementById("phone").value.trim();

            let dob =
                document.getElementById("dob").value;

            let course =
                document.getElementById("course").value;

            let address =
                document.getElementById("address").value.trim();

            let marks =
                document.getElementById("marks").value;

            let gender =
                document.querySelector(
                    'input[name="gender"]:checked'
                );

            let message =
                document.getElementById("message");

            let errors = [];

            if (name === "") {
                errors.push("Enter applicant name");
            }

            if (email === "") {
                errors.push("Enter email");
            }

            if (phone.length !== 10) {
                errors.push("Enter valid 10 digit phone number");
            }

            if (dob === "") {
                errors.push("Select date of birth");
            }

            if (course === "") {
                errors.push("Select a course");
            }

            if (!gender) {
                errors.push("Select gender");
            }

            if (address === "") {
                errors.push("Enter address");
            }

            if (marks === "") {
                errors.push("Enter marks");
            }

            if (errors.length === 0) {

                message.className = "success";

                message.innerHTML =
                    "Application Submitted Successfully<br><br>" +
                    "Name : " + name + "<br>" +
                    "Email : " + email + "<br>" +
                    "Phone : " + phone + "<br>" +
                    "Date of Birth : " + dob + "<br>" +
                    "Course : " + course + "<br>" +
                    "Gender : " + gender.value + "<br>" +
                    "Marks : " + marks + "%";

            } else {

                message.className = "error";

                message.innerHTML =
                    "Please fill the following details:<br><br>" +
                    errors.join("<br>");

            }

        });

    </script>

</body>
</html>
