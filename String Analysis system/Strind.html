<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>String Analysis System</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3eaff;
        }

        .container {
            width: 700px;
            max-width: 90%;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: auto;
            background-color: #7148a3;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 75px;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #7148a3;
            margin-top: 20px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            color: #7148a3;
            border-bottom: 2px solid #d8c7eb;
            padding-bottom: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 13px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 7px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #7148a3;
        }

        .info {
            margin-top: 20px;
            padding: 13px;
            background-color: #f7f1fc;
            border-left: 4px solid #7148a3;
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background-color: #7148a3;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #593680;
        }

        #error {
            margin-top: 20px;
            padding: 15px;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            border-radius: 6px;
            display: none;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="icon">
        A
    </div>


    <h1>
        String Analysis System
    </h1>


    <p class="subtitle">
        Analyze characters, words, numbers and symbols
    </p>


    <form id="stringForm">


        <div class="section">

            <h2>
                Enter String
            </h2>


            <label>
                String / Text
            </label>

            <textarea
                id="inputString"
                placeholder="Enter your text here..."
            ></textarea>


            <div class="info">

                <strong>
                    Analysis Information
                </strong>

                <br>

                The system will analyze your text and
                calculate characters, words, vowels,
                consonants, digits, spaces and special
                characters.

            </div>

        </div>


        <button type="submit">
            Analyze String
        </button>


    </form>


    <div id="error"></div>


</div>


<script>


    document.getElementById("stringForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        let text =
            document.getElementById("inputString")
            .value;


        let errorBox =
            document.getElementById("error");


        /*
            Validate input
        */

        if (text.trim() === "") {

            errorBox.style.display = "block";

            errorBox.innerHTML =
                "Please enter a string to analyze.";

            return;

        }


        errorBox.style.display = "none";


        /*
            Character count
        */

        let totalCharacters =
            text.length;


        /*
            Characters excluding spaces
        */

        let charactersWithoutSpaces =
            text.replace(/\s/g, "").length;


        /*
            Word count
        */

        let words =
            text.trim().split(/\s+/);


        let wordCount =
            words.length;


        /*
            Vowel count
        */

        let vowels =
            (text.match(/[aeiouAEIOU]/g) || []).length;


        /*
            Consonant count
        */

        let consonants =
            (
                text.match(/[b-df-hj-np-tv-zB-DF-HJ-NP-TV-Z]/g)
                || []
            ).length;


        /*
            Digit count
        */

        let digits =
            (text.match(/[0-9]/g) || []).length;


        /*
            Space count
        */

        let spaces =
            (text.match(/\s/g) || []).length;


        /*
            Special character count

            Special characters are characters
            that are not letters, numbers or spaces.
        */

        let specialCharacters =
            (
                text.match(/[^a-zA-Z0-9\s]/g)
                || []
            ).length;


        /*
            Uppercase count
        */

        let uppercase =
            (
                text.match(/[A-Z]/g)
                || []
            ).length;


        /*
            Lowercase count
        */

        let lowercase =
            (
                text.match(/[a-z]/g)
                || []
            ).length;


        /*
            Generate Analysis ID
        */

        let analysisId =
            "STR" +
            Math.floor(
                100000 +
                Math.random() * 900000
            );


        /*
            Store analysis information
        */

        let analysisData = {

            analysisId:
                analysisId,

            originalText:
                text,

            totalCharacters:
                totalCharacters,

            charactersWithoutSpaces:
                charactersWithoutSpaces,

            wordCount:
                wordCount,

            vowels:
                vowels,

            consonants:
                consonants,

            digits:
                digits,

            spaces:
                spaces,

            specialCharacters:
                specialCharacters,

            uppercase:
                uppercase,

            lowercase:
                lowercase,

            status:
                "Analysis Completed"

        };


        sessionStorage.setItem(

            "stringAnalysis",

            JSON.stringify(analysisData)

        );


        /*
            Open Page 2
        */

        window.location.href =
            "string-success.html";


    });


</script>


</body>

</html>
