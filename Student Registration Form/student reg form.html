<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff1e6;
        }

        .container {
            width: 700px;
            max-width: 92%;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: auto;
            background-color: #d66b27;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 75px;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #d66b27;
            margin-top: 20px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 28px;
        }

        .section h2 {
            color: #d66b27;
            border-bottom: 2px solid #f0c9ae;
            padding-bottom: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #d66b27;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row div {
            flex: 1;
        }

        .info {
            margin-top: 20px;
            padding: 13px;
            background-color: #fff7f0;
            border-left: 4px solid #d66b27;
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background-color: #d66b27;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #b8541d;
        }

        #error {
            margin-top: 20px;
            padding: 15px;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            border-radius: 6px;
            display: none;
            line-height: 1.7;
        }

        @media screen and (max-width: 600px) {

            .row {
                display: block;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <div class="icon">
        S
    </div>

    <h1>
        Student Registration Form
    </h1>

    <p class="subtitle">
        Register a student with personal and academic details
    </p>


    <form id="registrationForm">


        <!-- Personal Details -->

        <div class="section">

            <h2>
                Personal Details
            </h2>


            <label>
                Student Name
            </label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >


            <div class="row">

                <div>

                    <label>
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                    >

                </div>


                <div>

                    <label>
                        Gender
                    </label>

                    <select id="gender">

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <label>
                Aadhaar / Student Identification Number
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="Enter identification number"
            >

        </div>


        <!-- Academic Details -->

        <div class="section">

            <h2>
                Academic Details
            </h2>


            <label>
                Course / Department
            </label>

            <select id="course">

                <option value="">
                    Select Course
                </option>

                <option value="Computer Science">
                    Computer Science
                </option>

                <option value="Information Technology">
                    Information Technology
                </option>

                <option value="Electronics and Communication">
                    Electronics and Communication
                </option>

                <option value="Mechanical Engineering">
                    Mechanical Engineering
                </option>

                <option value="Civil Engineering">
                    Civil Engineering
                </option>

                <option value="Business Administration">
                    Business Administration
                </option>

            </select>


            <div class="row">

                <div>

                    <label>
                        Year
                    </label>

                    <select id="year">

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Roll Number
                    </label>

                    <input
                        type="text"
                        id="rollNumber"
                        placeholder="Enter roll number"
                    >

                </div>

            </div>


            <label>
                Previous Qualification
            </label>

            <input
                type="text"
                id="qualification"
                placeholder="Example: HSC / Diploma"
            >

        </div>


        <!-- Contact Details -->

        <div class="section">

            <h2>
                Contact Details
            </h2>


            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter email address"
            >


            <div class="row">

                <div>

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        maxlength="10"
                        placeholder="Enter 10-digit phone number"
                    >

                </div>


                <div>

                    <label>
                        Parent / Guardian Name
                    </label>

                    <input
                        type="text"
                        id="guardian"
                        placeholder="Enter parent name"
                    >

                </div>

            </div>


            <label>
                Address
            </label>

            <textarea
                id="address"
                placeholder="Enter complete address"
            ></textarea>


            <div class="info">

                <strong>
                    Registration Information
                </strong>

                <br>

                Please enter correct information before
                submitting the registration form.

            </div>

        </div>


        <button type="submit">
            Register Student
        </button>


    </form>


    <div id="error"></div>


</div>


<script>

    document.getElementById("registrationForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        let studentName =
            document.getElementById("studentName")
            .value.trim();

        let dob =
            document.getElementById("dob")
            .value;

        let gender =
            document.getElementById("gender")
            .value;

        let studentId =
            document.getElementById("studentId")
            .value.trim();

        let course =
            document.getElementById("course")
            .value;

        let year =
            document.getElementById("year")
            .value;

        let rollNumber =
            document.getElementById("rollNumber")
            .value.trim();

        let qualification =
            document.getElementById("qualification")
            .value.trim();

        let email =
            document.getElementById("email")
            .value.trim();

        let phone =
            document.getElementById("phone")
            .value.trim();

        let guardian =
            document.getElementById("guardian")
            .value.trim();

        let address =
            document.getElementById("address")
            .value.trim();


        let errors = [];


        if (studentName === "") {
            errors.push("Enter student name");
        }

        if (dob === "") {
            errors.push("Select date of birth");
        }

        if (gender === "") {
            errors.push("Select gender");
        }

        if (studentId === "") {
            errors.push("Enter identification number");
        }

        if (course === "") {
            errors.push("Select course or department");
        }

        if (year === "") {
            errors.push("Select year");
        }

        if (rollNumber === "") {
            errors.push("Enter roll number");
        }

        if (qualification === "") {
            errors.push("Enter previous qualification");
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            errors.push("Enter a valid email address");
        }

        if (!/^[0-9]{10}$/.test(phone)) {
            errors.push("Enter a valid 10-digit phone number");
        }

        if (guardian === "") {
            errors.push("Enter parent / guardian name");
        }

        if (address === "") {
            errors.push("Enter address");
        }


        let errorBox =
            document.getElementById("error");


        if (errors.length > 0) {

            errorBox.style.display = "block";

            errorBox.innerHTML =
                "<strong>Please correct the following:</strong>" +
                "<br><br>" +
                errors.join("<br>");

            return;

        }


        errorBox.style.display = "none";


        /*
            Generate registration number
        */

        let registrationNumber =
            "REG" +
            Math.floor(
                100000 +
                Math.random() * 900000
            );


        /*
            Format date
        */

        let dateObject =
            new Date(dob);

        let formattedDob =
            dateObject.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );


        /*
            Store registration data
        */

        let registrationData = {

            registrationNumber:
                registrationNumber,

            studentName:
                studentName,

            dob:
                formattedDob,

            gender:
                gender,

            studentId:
                studentId,

            course:
                course,

            year:
                year,

            rollNumber:
                rollNumber,

            qualification:
                qualification,

            email:
                email,

            phone:
                phone,

            guardian:
                guardian,

            address:
                address,

            status:
                "Registration Completed"

        };


        sessionStorage.setItem(
            "studentRegistration",
            JSON.stringify(registrationData)
        );


        /*
            Open Page 2
        */

        window.location.href =
            "student-registration-success.html";

    });

</script>


</body>

</html>
