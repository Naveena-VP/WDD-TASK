<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electricity Bill Calculator</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff8dc;
        }

        .container {
            width: 700px;
            max-width: 90%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.18);
        }

        h1 {
            text-align: center;
            color: #9a6700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            color: #9a6700;
            border-bottom: 2px solid #f0d98c;
            padding-bottom: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #9a6700;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row div {
            flex: 1;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 11px 30px;
            background-color: #9a6700;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #735000;
        }

        #error {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            color: #c62828;
            background-color: #ffebee;
            border-radius: 5px;
            display: none;
        }

        @media screen and (max-width: 600px) {

            .row {
                display: block;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>Electricity Bill Calculator</h1>

    <p class="subtitle">
        Enter electricity usage details to calculate your bill
    </p>


    <form id="billForm">


        <!-- Customer Information -->

        <div class="section">

            <h2>Customer Information</h2>


            <label>Customer Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter customer name"
            >


            <div class="row">

                <div>

                    <label>Consumer Number</label>

                    <input
                        type="text"
                        id="consumerNo"
                        placeholder="Enter consumer number"
                    >

                </div>


                <div>

                    <label>Billing Month</label>

                    <select id="month">

                        <option value="">
                            Select Month
                        </option>

                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>

                    </select>

                </div>

            </div>


            <label>Address</label>

            <input
                type="text"
                id="address"
                placeholder="Enter address"
            >

        </div>


        <!-- Electricity Usage -->

        <div class="section">

            <h2>Electricity Usage</h2>


            <div class="row">

                <div>

                    <label>Previous Reading (Units)</label>

                    <input
                        type="number"
                        id="previous"
                        placeholder="Previous reading"
                        min="0"
                    >

                </div>


                <div>

                    <label>Current Reading (Units)</label>

                    <input
                        type="number"
                        id="current"
                        placeholder="Current reading"
                        min="0"
                    >

                </div>

            </div>


            <label>Connection Type</label>

            <select id="connection">

                <option value="">
                    Select Connection Type
                </option>

                <option value="Domestic">
                    Domestic
                </option>

                <option value="Commercial">
                    Commercial
                </option>

            </select>

        </div>


        <button type="submit">
            Calculate Bill
        </button>


    </form>


    <div id="error"></div>


</div>


<script>

    document.getElementById("billForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        let name =
            document.getElementById("name")
            .value.trim();


        let consumerNo =
            document.getElementById("consumerNo")
            .value.trim();


        let month =
            document.getElementById("month")
            .value;


        let address =
            document.getElementById("address")
            .value.trim();


        let previous =
            Number(
                document.getElementById("previous").value
            );


        let current =
            Number(
                document.getElementById("current").value
            );


        let connection =
            document.getElementById("connection").value;


        let errors = [];


        if (name === "") {
            errors.push("Enter customer name");
        }


        if (consumerNo === "") {
            errors.push("Enter consumer number");
        }


        if (month === "") {
            errors.push("Select billing month");
        }


        if (address === "") {
            errors.push("Enter address");
        }


        if (previous < 0) {
            errors.push("Enter valid previous reading");
        }


        if (current <= 0) {
            errors.push("Enter valid current reading");
        }


        if (current < previous) {
            errors.push(
                "Current reading cannot be less than previous reading"
            );
        }


        if (connection === "") {
            errors.push("Select connection type");
        }


        let errorBox =
            document.getElementById("error");


        if (errors.length > 0) {

            errorBox.style.display = "block";

            errorBox.innerHTML =
                "<strong>Please correct the following:</strong>" +
                "<br><br>" +
                errors.join("<br>");

            return;
        }


        /*
           Calculate units used
        */

        let units = current - previous;


        /*
           Domestic tariff calculation

           0 - 100 units       = ₹2.50/unit
           101 - 200 units     = ₹4.00/unit
           201 - 500 units     = ₹5.50/unit
           Above 500 units     = ₹7.00/unit
        */

        let energyCharge = 0;


        if (units <= 100) {

            energyCharge = units * 2.50;

        }

        else if (units <= 200) {

            energyCharge =
                (100 * 2.50) +
                ((units - 100) * 4.00);

        }

        else if (units <= 500) {

            energyCharge =
                (100 * 2.50) +
                (100 * 4.00) +
                ((units - 200) * 5.50);

        }

        else {

            energyCharge =
                (100 * 2.50) +
                (100 * 4.00) +
                (300 * 5.50) +
                ((units - 500) * 7.00);

        }


        /*
           Commercial connection
           has an additional 20% charge
        */

        if (connection === "Commercial") {

            energyCharge =
                energyCharge * 1.20;

        }


        let fixedCharge = 50;

        let totalBill =
            energyCharge + fixedCharge;


        /*
           Store bill information
        */

        let billData = {

            name: name,

            consumerNo: consumerNo,

            month: month,

            address: address,

            previous: previous,

            current: current,

            units: units,

            connection: connection,

            energyCharge: energyCharge.toFixed(2),

            fixedCharge: fixedCharge.toFixed(2),

            totalBill: totalBill.toFixed(2)

        };


        localStorage.setItem(
            "electricityBill",
            JSON.stringify(billData)
        );


        /*
           Open next page
        */

        window.location.href =
            "electricity-bill-success.html";

    });

</script>


</body>

</html>
