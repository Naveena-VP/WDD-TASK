<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electricity Bill Generated</title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff8dc;
        }

        .container {
            width: 650px;
            max-width: 90%;
            margin: 50px auto;

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.18);
        }

        .success-icon {
            width: 70px;
            height: 70px;

            margin: auto;

            border-radius: 50%;

            background-color: #2e7d32;

            color: white;

            font-size: 42px;

            text-align: center;

            line-height: 70px;
        }

        h1 {
            text-align: center;

            color: #9a6700;

            margin-top: 20px;
        }

        .message {
            text-align: center;

            color: #555;

            margin-bottom: 25px;
        }

        .bill {
            background-color: #fffaf0;

            border: 1px solid #f0d98c;

            padding: 20px;

            border-radius: 8px;
        }

        .bill h2 {
            text-align: center;

            color: #9a6700;

            border-bottom: 2px solid #f0d98c;

            padding-bottom: 10px;
        }

        .detail {
            display: flex;

            justify-content: space-between;

            padding: 8px 0;

            border-bottom: 1px solid #eee;
        }

        .detail strong {
            color: #555;
        }

        .amount {
            margin-top: 20px;

            padding: 18px;

            text-align: center;

            background-color: #fff0b3;

            border-radius: 8px;

            color: #795500;
        }

        .amount h2 {
            margin: 5px 0;

            font-size: 28px;
        }

        button {
            display: block;

            margin: 25px auto 0;

            padding: 11px 25px;

            background-color: #9a6700;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;
        }

        button:hover {
            background-color: #735000;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="success-icon">
        ✓
    </div>


    <h1>
        Electricity Bill Generated!
    </h1>


    <p class="message">
        Your electricity bill has been calculated successfully.
    </p>


    <div class="bill">


        <h2>Bill Details</h2>


        <div class="detail">

            <strong>Customer Name</strong>

            <span id="name"></span>

        </div>


        <div class="detail">

            <strong>Consumer Number</strong>

            <span id="consumerNo"></span>

        </div>


        <div class="detail">

            <strong>Billing Month</strong>

            <span id="month"></span>

        </div>


        <div class="detail">

            <strong>Address</strong>

            <span id="address"></span>

        </div>


        <div class="detail">

            <strong>Connection Type</strong>

            <span id="connection"></span>

        </div>


        <div class="detail">

            <strong>Previous Reading</strong>

            <span id="previous"></span>

        </div>


        <div class="detail">

            <strong>Current Reading</strong>

            <span id="current"></span>

        </div>


        <div class="detail">

            <strong>Units Consumed</strong>

            <span id="units"></span>

        </div>


        <div class="detail">

            <strong>Energy Charge</strong>

            <span>
                ₹<span id="energyCharge"></span>
            </span>

        </div>


        <div class="detail">

            <strong>Fixed Charge</strong>

            <span>
                ₹<span id="fixedCharge"></span>
            </span>

        </div>


        <div class="amount">

            <p>
                Total Electricity Bill
            </p>

            <h2>
                ₹<span id="totalBill"></span>
            </h2>

        </div>


    </div>


    <button onclick="goBack()">
        Calculate Another Bill
    </button>


</div>


<script>


    let data =
        JSON.parse(
            localStorage.getItem("electricityBill")
        );


    if (data) {


        document.getElementById("name")
            .innerHTML = data.name;


        document.getElementById("consumerNo")
            .innerHTML = data.consumerNo;


        document.getElementById("month")
            .innerHTML = data.month;


        document.getElementById("address")
            .innerHTML = data.address;


        document.getElementById("connection")
            .innerHTML = data.connection;


        document.getElementById("previous")
            .innerHTML = data.previous + " Units";


        document.getElementById("current")
            .innerHTML = data.current + " Units";


        document.getElementById("units")
            .innerHTML = data.units + " Units";


        document.getElementById("energyCharge")
            .innerHTML = data.energyCharge;


        document.getElementById("fixedCharge")
            .innerHTML = data.fixedCharge;


        document.getElementById("totalBill")
            .innerHTML = data.totalBill;

    }


    function goBack() {

        window.location.href =
            "electricity-bill.html";

    }


</script>


</body>

</html>
