<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meeting Registration Completed</title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eee9ff;
        }


        .container {
            width: 700px;
            max-width: 90%;

            margin: 45px auto;

            background-color: white;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.15);
        }


        .success-icon {
            width: 70px;
            height: 70px;

            margin: auto;

            border-radius: 50%;

            background-color: #51418a;

            color: white;

            font-size: 42px;

            text-align: center;

            line-height: 70px;
        }


        h1 {
            text-align: center;

            color: #51418a;

            margin-top: 20px;
        }


        .message {
            text-align: center;

            color: #555;

            margin-bottom: 25px;
        }


        .meeting-id {
            text-align: center;

            background-color: #f3f0ff;

            padding: 14px;

            border-radius: 7px;

            color: #51418a;

            font-weight: bold;

            margin-bottom: 20px;
        }


        .details {
            background-color: #f7f5ff;

            border: 1px solid #d4cdf2;

            padding: 20px;

            border-radius: 8px;
        }


        .details h2 {
            text-align: center;

            color: #51418a;

            border-bottom: 2px solid #d4cdf2;

            padding-bottom: 10px;
        }


        .detail {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 11px 0;

            border-bottom: 1px solid #ddd;
        }


        .detail strong {
            color: #555;
        }


        .detail span {
            text-align: right;

            color: #333;
        }


        .meeting-card {
            margin-top: 20px;

            padding: 20px;

            background-color: #eeeaff;

            border-radius: 8px;
        }


        .meeting-card h2 {
            text-align: center;

            color: #51418a;

            margin-top: 0;
        }


        .meeting-info {
            display: flex;

            gap: 15px;

            margin-top: 15px;
        }


        .info-box {
            flex: 1;

            padding: 15px;

            text-align: center;

            background-color: white;

            border-radius: 7px;

            border: 1px solid #d4cdf2;
        }


        .info-box h3 {
            color: #51418a;

            margin: 5px;
        }


        .info-box p {
            color: #333;

            font-weight: bold;
        }


        .status {
            margin-top: 20px;

            padding: 15px;

            text-align: center;

            background-color: #e1f3e8;

            color: #26734d;

            border-radius: 7px;

            font-size: 18px;

            font-weight: bold;
        }


        button {
            display: block;

            margin: 25px auto 0;

            padding: 12px 28px;

            background-color: #51418a;

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 15px;
        }


        button:hover {
            background-color: #3e326d;
        }


        @media screen and (max-width: 600px) {

            .detail {
                display: block;
            }


            .detail span {
                display: block;

                text-align: left;

                margin-top: 5px;
            }


            .meeting-info {
                display: block;
            }


            .info-box {
                margin-bottom: 10px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="success-icon">
        ✓
    </div>


    <h1>
        Registration Completed!
    </h1>


    <p class="message">
        Parent–Teacher Meeting has been registered successfully.
    </p>


    <div class="meeting-id">

        Meeting ID:
        <span id="meetingId"></span>

    </div>


    <!-- Parent Information -->

    <div class="details">


        <h2>
            Parent Information
        </h2>


        <div class="detail">

            <strong>
                Parent Name
            </strong>

            <span id="parentName"></span>

        </div>


        <div class="detail">

            <strong>
                Phone Number
            </strong>

            <span id="phone"></span>

        </div>


        <div class="detail">

            <strong>
                Email
            </strong>

            <span id="email"></span>

        </div>


        <!-- Student Information -->

        <h2>
            Student Information
        </h2>


        <div class="detail">

            <strong>
                Student Name
            </strong>

            <span id="studentName"></span>

        </div>


        <div class="detail">

            <strong>
                Student ID
            </strong>

            <span id="studentId"></span>

        </div>


        <div class="detail">

            <strong>
                Class & Section
            </strong>

            <span id="classSection"></span>

        </div>


    </div>


    <!-- Meeting Information -->

    <div class="meeting-card">


        <h2>
            Meeting Details
        </h2>


        <div class="meeting-info">


            <div class="info-box">

                <h3>
                    Date
                </h3>

                <p id="meetingDate"></p>

            </div>


            <div class="info-box">

                <h3>
                    Time
                </h3>

                <p id="meetingTime"></p>

            </div>


            <div class="info-box">

                <h3>
                    Mode
                </h3>

                <p id="meetingMode"></p>

            </div>


        </div>


        <div class="details"
             style="margin-top: 20px;">

            <div class="detail">

                <strong>
                    Discussion Topic
                </strong>

                <span id="topic"></span>

            </div>

        </div>


    </div>


    <div class="status">

        ✓ Meeting Registration Confirmed

    </div>


    <button onclick="registerAgain()">

        Register Another Meeting

    </button>


</div>


<script>


    /*
        Get registration data
        from Page 1
    */

    let data =
        JSON.parse(

            localStorage.getItem(
                "parentTeacherMeeting"
            )

        );


    if (data) {


        document.getElementById("meetingId")
            .innerHTML =
            data.meetingId;


        document.getElementById("parentName")
            .innerHTML =
            data.parentName;


        document.getElementById("phone")
            .innerHTML =
            data.phone;


        document.getElementById("email")
            .innerHTML =
            data.email;


        document.getElementById("studentName")
            .innerHTML =
            data.studentName;


        document.getElementById("studentId")
            .innerHTML =
            data.studentId;


        document.getElementById("classSection")
            .innerHTML =
            "Class " +
            data.studentClass +
            " - Section " +
            data.section;


        document.getElementById("meetingDate")
            .innerHTML =
            data.meetingDate;


        document.getElementById("meetingTime")
            .innerHTML =
            data.meetingTime;


        document.getElementById("meetingMode")
            .innerHTML =
            data.meetingMode;


        document.getElementById("topic")
            .innerHTML =
            data.topic;

    }


    /*
        Register another meeting
    */

    function registerAgain() {

        window.location.href =
            "parent-teacher-meeting.html";

    }


</script>


</body>

</html>
