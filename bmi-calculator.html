<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3e5f5;
        }

        .container {
            width: 400px;
            margin: 70px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.20);
        }

        h2 {
            text-align: center;
            color: #6a1b9a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 10px 25px;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4a126b;
        }

        #result {
            text-align: center;
            margin-top: 25px;
            font-weight: bold;
            line-height: 1.8;
        }

        .error {
            color: red;
        }

        .normal {
            color: green;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>BMI Calculator</h2>

        <form id="bmiForm">

            <label>Enter Your Name</label>
            <input type="text" id="name"
                   placeholder="Enter your name">

            <label>Weight (kg)</label>
            <input type="number" id="weight"
                   placeholder="Enter weight in kg"
                   step="0.1">

            <label>Height (cm)</label>
            <input type="number" id="height"
                   placeholder="Enter height in cm"
                   step="0.1">

            <button type="submit">
                Calculate BMI
            </button>

        </form>

        <div id="result"></div>

    </div>


    <script>

        document.getElementById("bmiForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let name =
                document.getElementById("name").value.trim();

            let weight =
                Number(document.getElementById("weight").value);

            let height =
                Number(document.getElementById("height").value);

            let result =
                document.getElementById("result");


            if (name === "" || weight <= 0 || height <= 0) {

                result.className = "error";

                result.innerHTML =
                    "Please enter valid details.";

                return;
            }


            // Convert height from cm to metres
            let heightInMetres = height / 100;


            // BMI calculation
            let bmi =
                weight / (heightInMetres * heightInMetres);

            bmi = bmi.toFixed(2);


            let category;


            if (bmi < 18.5) {

                category = "Underweight";

            } else if (bmi < 25) {

                category = "Normal Weight";

            } else if (bmi < 30) {

                category = "Overweight";

            } else {

                category = "Obese";
            }


            result.className = "normal";

            result.innerHTML =
                "BMI Calculated Successfully!<br><br>" +
                "Name : " + name + "<br>" +
                "Weight : " + weight + " kg<br>" +
                "Height : " + height + " cm<br>" +
                "BMI : " + bmi + "<br>" +
                "Category : " + category;

        });

    </script>

</body>
</html>
