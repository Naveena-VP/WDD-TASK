<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sales Calculator</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eaf2ff;
        }

        .container {
            width: 650px;
            max-width: 90%;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: auto;
            background-color: #315a9b;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 75px;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #315a9b;
            margin-top: 20px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            color: #315a9b;
            border-bottom: 2px solid #cbd9f0;
            padding-bottom: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #315a9b;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row div {
            flex: 1;
        }

        .info {
            margin-top: 20px;
            padding: 13px;
            background-color: #f2f6fc;
            border-left: 4px solid #315a9b;
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background-color: #315a9b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #244477;
        }

        #error {
            margin-top: 20px;
            padding: 15px;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            border-radius: 6px;
            display: none;
            line-height: 1.7;
        }

        @media screen and (max-width: 600px) {

            .row {
                display: block;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="icon">
        ₹
    </div>


    <h1>
        Sales Calculator
    </h1>


    <p class="subtitle">
        Calculate product sales with discount and tax
    </p>


    <form id="salesForm">


        <!-- Sales Information -->

        <div class="section">

            <h2>
                Sales Information
            </h2>


            <label>
                Salesperson Name
            </label>

            <input
                type="text"
                id="salesperson"
                placeholder="Enter salesperson name"
            >


            <label>
                Product Name
            </label>

            <input
                type="text"
                id="product"
                placeholder="Enter product name"
            >


            <div class="row">

                <div>

                    <label>
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        min="1"
                        placeholder="Enter quantity"
                    >

                </div>


                <div>

                    <label>
                        Unit Price (₹)
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        placeholder="Enter unit price"
                    >

                </div>

            </div>

        </div>


        <!-- Discount and Tax -->

        <div class="section">

            <h2>
                Discount & Tax
            </h2>


            <div class="row">

                <div>

                    <label>
                        Discount (%)
                    </label>

                    <input
                        type="number"
                        id="discount"
                        min="0"
                        max="100"
                        step="0.01"
                        value="0"
                    >

                </div>


                <div>

                    <label>
                        Tax (%)
                    </label>

                    <input
                        type="number"
                        id="tax"
                        min="0"
                        max="100"
                        step="0.01"
                        value="0"
                    >

                </div>

            </div>


            <div class="info">

                <strong>
                    Calculation Formula
                </strong>

                <br>

                Subtotal = Quantity × Unit Price

                <br>

                Discount Amount = Subtotal × Discount %

                <br>

                Tax Amount = Discounted Amount × Tax %

                <br>

                Final Total = Discounted Amount + Tax Amount

            </div>

        </div>


        <button type="submit">
            Calculate Sale
        </button>


    </form>


    <div id="error"></div>


</div>


<script>


    document.getElementById("salesForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        let salesperson =
            document.getElementById("salesperson")
            .value.trim();


        let product =
            document.getElementById("product")
            .value.trim();


        let quantity =
            Number(
                document.getElementById("quantity")
                .value
            );


        let price =
            Number(
                document.getElementById("price")
                .value
            );


        let discount =
            Number(
                document.getElementById("discount")
                .value
            );


        let tax =
            Number(
                document.getElementById("tax")
                .value
            );


        let errors = [];


        if (salesperson === "") {

            errors.push(
                "Enter salesperson name"
            );

        }


        if (product === "") {

            errors.push(
                "Enter product name"
            );

        }


        if (
            !quantity ||
            quantity <= 0
        ) {

            errors.push(
                "Enter a valid quantity"
            );

        }


        if (
            isNaN(price) ||
            price <= 0
        ) {

            errors.push(
                "Enter a valid unit price"
            );

        }


        if (
            discount < 0 ||
            discount > 100
        ) {

            errors.push(
                "Discount must be between 0% and 100%"
            );

        }


        if (
            tax < 0 ||
            tax > 100
        ) {

            errors.push(
                "Tax must be between 0% and 100%"
            );

        }


        let errorBox =
            document.getElementById("error");


        if (errors.length > 0) {

            errorBox.style.display = "block";

            errorBox.innerHTML =
                "<strong>Please correct the following:</strong>" +
                "<br><br>" +
                errors.join("<br>");

            return;

        }


        /*
            Calculate subtotal
        */

        let subtotal =
            quantity * price;


        /*
            Calculate discount
        */

        let discountAmount =
            subtotal * discount / 100;


        let discountedAmount =
            subtotal - discountAmount;


        /*
            Calculate tax
        */

        let taxAmount =
            discountedAmount * tax / 100;


        /*
            Calculate final total
        */

        let finalTotal =
            discountedAmount + taxAmount;


        /*
            Generate Sales ID
        */

        let salesId =
            "SAL" +
            Math.floor(
                100000 +
                Math.random() * 900000
            );


        /*
            Store calculation data
        */

        let salesData = {

            salesId:
                salesId,

            salesperson:
                salesperson,

            product:
                product,

            quantity:
                quantity,

            price:
                price,

            discount:
                discount,

            discountAmount:
                discountAmount,

            subtotal:
                subtotal,

            discountedAmount:
                discountedAmount,

            tax:
                tax,

            taxAmount:
                taxAmount,

            finalTotal:
                finalTotal,

            status:
                "Calculation Completed"

        };


        sessionStorage.setItem(

            "salesCalculation",

            JSON.stringify(salesData)

        );


        /*
            Open Page 2
        */

        window.location.href =
            "sales-success.html";


    });


</script>


</body>

</html>
