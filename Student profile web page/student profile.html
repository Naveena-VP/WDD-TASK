<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Profile Web Page</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e8f3ff;
        }

        .container {
            width: 750px;
            max-width: 92%;
            margin: 40px auto;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: auto;
            background-color: #2467a8;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 75px;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #2467a8;
            margin-top: 20px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 28px;
        }

        .section h2 {
            color: #2467a8;
            border-bottom: 2px solid #c5dcef;
            padding-bottom: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2467a8;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row div {
            flex: 1;
        }

        .info {
            margin-top: 20px;
            padding: 13px;
            background-color: #f1f7fc;
            border-left: 4px solid #2467a8;
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background-color: #2467a8;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #194e80;
        }

        #error {
            margin-top: 20px;
            padding: 15px;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            border-radius: 6px;
            display: none;
            line-height: 1.7;
        }

        @media screen and (max-width: 600px) {

            .row {
                display: block;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="icon">
        S
    </div>


    <h1>
        Student Profile Web Page
    </h1>


    <p class="subtitle">
        Create and manage student profile information
    </p>


    <form id="studentForm">


        <!-- Personal Information -->

        <div class="section">

            <h2>
                Personal Information
            </h2>


            <label>
                Student Name
            </label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >


            <div class="row">

                <div>

                    <label>
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter student ID"
                    >

                </div>


                <div>

                    <label>
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                    >

                </div>

            </div>


            <div class="row">

                <div>

                    <label>
                        Gender
                    </label>

                    <select id="gender">

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        min="1"
                        max="100"
                        placeholder="Enter age"
                    >

                </div>

            </div>

        </div>


        <!-- Academic Information -->

        <div class="section">

            <h2>
                Academic Information
            </h2>


            <label>
                Department
            </label>

            <select id="department">

                <option value="">
                    Select Department
                </option>

                <option value="Computer Science">
                    Computer Science
                </option>

                <option value="Information Technology">
                    Information Technology
                </option>

                <option value="Electronics and Communication">
                    Electronics and Communication
                </option>

                <option value="Electrical and Electronics">
                    Electrical and Electronics
                </option>

                <option value="Mechanical Engineering">
                    Mechanical Engineering
                </option>

                <option value="Civil Engineering">
                    Civil Engineering
                </option>

                <option value="Business Administration">
                    Business Administration
                </option>

            </select>


            <label>
                Year of Study
            </label>

            <select id="year">

                <option value="">
                    Select Year
                </option>

                <option value="1st Year">
                    1st Year
                </option>

                <option value="2nd Year">
                    2nd Year
                </option>

                <option value="3rd Year">
                    3rd Year
                </option>

                <option value="4th Year">
                    4th Year
                </option>

            </select>


            <label>
                Academic Performance
            </label>

            <input
                type="text"
                id="performance"
                placeholder="Example: CGPA 8.5"
            >

        </div>


        <!-- Contact Information -->

        <div class="section">

            <h2>
                Contact Information
            </h2>


            <div class="row">

                <div>

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                    >

                </div>


                <div>

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        maxlength="10"
                        placeholder="Enter 10-digit number"
                    >

                </div>

            </div>


            <label>
                Address
            </label>

            <textarea
                id="address"
                placeholder="Enter complete address"
            ></textarea>

        </div>


        <!-- Guardian Information -->

        <div class="section">

            <h2>
                Guardian Information
            </h2>


            <label>
                Guardian Name
            </label>

            <input
                type="text"
                id="guardianName"
                placeholder="Enter guardian name"
            >


            <label>
                Guardian Phone Number
            </label>

            <input
                type="tel"
                id="guardianPhone"
                maxlength="10"
                placeholder="Enter guardian phone number"
            >


            <div class="info">

                <strong>
                    Profile Information
                </strong>

                <br>

                Please enter accurate student information.
                This webpage is created for educational
                and demonstration purposes.

            </div>

        </div>


        <button type="submit">
            Create Student Profile
        </button>


    </form>


    <div id="error"></div>


</div>


<script>


    document.getElementById("studentForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        let studentName =
            document.getElementById("studentName")
            .value.trim();


        let studentId =
            document.getElementById("studentId")
            .value.trim();


        let dob =
            document.getElementById("dob")
            .value;


        let gender =
            document.getElementById("gender")
            .value;


        let age =
            Number(
                document.getElementById("age")
                .value
            );


        let department =
            document.getElementById("department")
            .value;


        let year =
            document.getElementById("year")
            .value;


        let performance =
            document.getElementById("performance")
            .value.trim();


        let email =
            document.getElementById("email")
            .value.trim();


        let phone =
            document.getElementById("phone")
            .value.trim();


        let address =
            document.getElementById("address")
            .value.trim();


        let guardianName =
            document.getElementById("guardianName")
            .value.trim();


        let guardianPhone =
            document.getElementById("guardianPhone")
            .value.trim();


        let errors = [];


        if (studentName === "") {

            errors.push(
                "Enter student name"
            );

        }


        if (studentId === "") {

            errors.push(
                "Enter student ID"
            );

        }


        if (dob === "") {

            errors.push(
                "Select date of birth"
            );

        }


        if (gender === "") {

            errors.push(
                "Select gender"
            );

        }


        if (
            !age ||
            age < 1 ||
            age > 100
        ) {

            errors.push(
                "Enter a valid age"
            );

        }


        if (department === "") {

            errors.push(
                "Select department"
            );

        }


        if (year === "") {

            errors.push(
                "Select year of study"
            );

        }


        if (performance === "") {

            errors.push(
                "Enter academic performance"
            );

        }


        if (
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
        ) {

            errors.push(
                "Enter a valid email address"
            );

        }


        if (
            !/^[0-9]{10}$/.test(phone)
        ) {

            errors.push(
                "Enter a valid 10-digit phone number"
            );

        }


        if (address === "") {

            errors.push(
                "Enter address"
            );

        }


        if (guardianName === "") {

            errors.push(
                "Enter guardian name"
            );

        }


        if (
            !/^[0-9]{10}$/.test(guardianPhone)
        ) {

            errors.push(
                "Enter a valid guardian phone number"
            );

        }


        let errorBox =
            document.getElementById("error");


        if (errors.length > 0) {

            errorBox.style.display = "block";

            errorBox.innerHTML =
                "<strong>Please correct the following:</strong>" +
                "<br><br>" +
                errors.join("<br>");

            return;

        }


        /*
            Generate Profile ID
        */

        let profileId =
            "STU" +
            Math.floor(
                100000 +
                Math.random() * 900000
            );


        /*
            Format date
        */

        let dobObject =
            new Date(dob);


        let formattedDob =
            dobObject.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );


        /*
            Store profile information
        */

        let studentData = {

            profileId:
                profileId,

            studentName:
                studentName,

            studentId:
                studentId,

            dob:
                formattedDob,

            gender:
                gender,

            age:
                age,

            department:
                department,

            year:
                year,

            performance:
                performance,

            email:
                email,

            phone:
                phone,

            address:
                address,

            guardianName:
                guardianName,

            guardianPhone:
                guardianPhone,

            status:
                "Profile Created Successfully"

        };


        sessionStorage.setItem(

            "studentProfile",

            JSON.stringify(studentData)

        );


        /*
            Open Page 2
        */

        window.location.href =
            "student-success.html";


    });


</script>


</body>

</html>
