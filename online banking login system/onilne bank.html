<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Online Banking Login System</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e8f1f8;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 60px auto;
            background-color: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .bank-icon {
            width: 70px;
            height: 70px;
            margin: auto;
            background-color: #174a6e;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 70px;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #174a6e;
            margin-top: 20px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #174a6e;
        }

        .info {
            margin-top: 18px;
            padding: 12px;
            background-color: #f0f6fa;
            border-left: 4px solid #174a6e;
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #174a6e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #103650;
        }

        #error {
            margin-top: 20px;
            padding: 15px;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            border-radius: 6px;
            display: none;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 12px;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="bank-icon">
        ₹
    </div>


    <h1>
        Online Banking Login
    </h1>


    <p class="subtitle">
        Secure access to your online banking account
    </p>


    <form id="loginForm">


        <div class="section">


            <label>
                Customer ID
            </label>

            <input
                type="text"
                id="customerId"
                placeholder="Enter customer ID"
            >


            <label>
                Account Number
            </label>

            <input
                type="text"
                id="accountNumber"
                placeholder="Enter account number"
            >


            <label>
                Account Type
            </label>

            <select id="accountType">

                <option value="">
                    Select Account Type
                </option>

                <option value="Savings Account">
                    Savings Account
                </option>

                <option value="Current Account">
                    Current Account
                </option>

                <option value="Salary Account">
                    Salary Account
                </option>

            </select>


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >


        </div>


        <div class="info">

            <strong>Demo Login Information</strong>

            <br>

            This webpage is created for educational purposes.
            Do not enter real banking passwords or account details.

        </div>


        <button type="submit">
            Login Securely
        </button>


    </form>


    <div id="error"></div>


    <div class="footer">

        Online Banking Login System | Demo Project

    </div>


</div>


<script>


    document.getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        let customerId =
            document.getElementById("customerId")
            .value.trim();


        let accountNumber =
            document.getElementById("accountNumber")
            .value.trim();


        let accountType =
            document.getElementById("accountType")
            .value;


        let password =
            document.getElementById("password")
            .value;


        let errors = [];


        if (customerId === "") {

            errors.push(
                "Enter customer ID"
            );

        }


        if (
            accountNumber === "" ||
            !/^[0-9]{8,16}$/.test(accountNumber)
        ) {

            errors.push(
                "Enter a valid account number"
            );

        }


        if (accountType === "") {

            errors.push(
                "Select account type"
            );

        }


        if (password.length < 4) {

            errors.push(
                "Password must contain at least 4 characters"
            );

        }


        let errorBox =
            document.getElementById("error");


        if (errors.length > 0) {

            errorBox.style.display = "block";

            errorBox.innerHTML =
                "<strong>Please correct the following:</strong>" +
                "<br><br>" +
                errors.join("<br>");

            return;

        }


        /*
            Get current date and time
        */

        let now = new Date();


        let loginDate =
            now.toLocaleDateString();


        let loginTime =
            now.toLocaleTimeString();


        /*
            Mask account number
        */

        let lastFour =
            accountNumber.slice(-4);


        let maskedAccount =
            "XXXXXX" + lastFour;


        /*
            Store login information.

            The password is intentionally
            NOT stored.
        */

        let bankingData = {

            customerId: customerId,

            accountNumber: maskedAccount,

            accountType: accountType,

            loginDate: loginDate,

            loginTime: loginTime,

            status: "Active",

            loginStatus: "Successful"

        };


        localStorage.setItem(

            "bankingLogin",

            JSON.stringify(bankingData)

        );


        /*
            Open Page 2
        */

        window.location.href =
            "banking-success.html";


    });


</script>


</body>

</html>
