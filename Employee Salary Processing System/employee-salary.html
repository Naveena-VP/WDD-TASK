<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Salary Processing System</title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff0e6;
        }

        .container {
            width: 750px;
            max-width: 90%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #a0522d;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            color: #a0522d;
            border-bottom: 2px solid #f1c7ad;
            padding-bottom: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #a0522d;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row div {
            flex: 1;
        }

        .info {
            margin-top: 10px;
            padding: 12px;
            background-color: #fff7f2;
            border-left: 4px solid #a0522d;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 12px 30px;
            background-color: #a0522d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #7f3f24;
        }

        #error {
            margin-top: 20px;
            padding: 15px;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            border-radius: 6px;
            display: none;
            line-height: 1.7;
        }

        @media screen and (max-width: 600px) {

            .row {
                display: block;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Employee Salary Processing System
    </h1>


    <p class="subtitle">
        Enter employee details and salary information
    </p>


    <form id="salaryForm">


        <!-- Employee Information -->

        <div class="section">


            <h2>
                Employee Information
            </h2>


            <div class="row">


                <div>

                    <label>
                        Employee Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter employee name"
                    >

                </div>


                <div>

                    <label>
                        Employee ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        placeholder="Example: EMP1001"
                    >

                </div>


            </div>


            <div class="row">


                <div>

                    <label>
                        Department
                    </label>

                    <select id="department">

                        <option value="">
                            Select Department
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="Human Resources">
                            Human Resources
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                        <option value="Sales">
                            Sales
                        </option>

                        <option value="Operations">
                            Operations
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Salary Month
                    </label>

                    <select id="month">

                        <option value="">
                            Select Month
                        </option>

                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>

                    </select>

                </div>


            </div>


        </div>


        <!-- Salary Information -->

        <div class="section">


            <h2>
                Salary Information
            </h2>


            <label>
                Basic Salary (₹)
            </label>

            <input
                type="number"
                id="basicSalary"
                placeholder="Enter basic salary"
                min="0"
            >


            <div class="row">


                <div>

                    <label>
                        HRA (₹)
                    </label>

                    <input
                        type="number"
                        id="hra"
                        placeholder="Enter HRA"
                        min="0"
                    >

                </div>


                <div>

                    <label>
                        Allowance (₹)
                    </label>

                    <input
                        type="number"
                        id="allowance"
                        placeholder="Enter allowance"
                        min="0"
                    >

                </div>


            </div>


            <div class="row">


                <div>

                    <label>
                        Bonus (₹)
                    </label>

                    <input
                        type="number"
                        id="bonus"
                        placeholder="Enter bonus"
                        min="0"
                        value="0"
                    >

                </div>


                <div>

                    <label>
                        Other Earnings (₹)
                    </label>

                    <input
                        type="number"
                        id="other"
                        placeholder="Enter other earnings"
                        min="0"
                        value="0"
                    >

                </div>


            </div>


            <div class="info">

                <strong>Deduction Calculation:</strong>

                <br>

                PF will be calculated as
                <strong>12%</strong> of Basic Salary.

                <br>

                Tax will be calculated as
                <strong>5%</strong> of Gross Salary.

            </div>


        </div>


        <button type="submit">
            Process Salary
        </button>


    </form>


    <div id="error"></div>


</div>


<script>


    document.getElementById("salaryForm")
    .addEventListener("submit", function(event) {


        event.preventDefault();


        let name =
            document.getElementById("name")
            .value.trim();


        let employeeId =
            document.getElementById("employeeId")
            .value.trim();


        let department =
            document.getElementById("department")
            .value;


        let month =
            document.getElementById("month")
            .value;


        let basicSalary =
            Number(
                document.getElementById("basicSalary")
                .value
            );


        let hra =
            Number(
                document.getElementById("hra")
                .value
            );


        let allowance =
            Number(
                document.getElementById("allowance")
                .value
            );


        let bonus =
            Number(
                document.getElementById("bonus")
                .value
            );


        let other =
            Number(
                document.getElementById("other")
                .value
            );


        let errors = [];


        if (name === "") {

            errors.push(
                "Enter employee name"
            );

        }


        if (employeeId === "") {

            errors.push(
                "Enter employee ID"
            );

        }


        if (department === "") {

            errors.push(
                "Select department"
            );

        }


        if (month === "") {

            errors.push(
                "Select salary month"
            );

        }


        if (basicSalary <= 0) {

            errors.push(
                "Enter a valid basic salary"
            );

        }


        if (hra < 0) {

            errors.push(
                "Enter valid HRA"
            );

        }


        if (allowance < 0) {

            errors.push(
                "Enter valid allowance"
            );

        }


        if (bonus < 0) {

            errors.push(
                "Enter valid bonus"
            );

        }


        if (other < 0) {

            errors.push(
                "Enter valid other earnings"
            );

        }


        let errorBox =
            document.getElementById("error");


        if (errors.length > 0) {

            errorBox.style.display = "block";

            errorBox.innerHTML =

                "<strong>Please correct the following:</strong>" +

                "<br><br>" +

                errors.join("<br>");

            return;

        }


        /*
            Calculate Gross Salary
        */

        let grossSalary =
            basicSalary +
            hra +
            allowance +
            bonus +
            other;


        /*
            Calculate PF
        */

        let pf =
            basicSalary * 0.12;


        /*
            Calculate Tax
        */

        let tax =
            grossSalary * 0.05;


        /*
            Calculate Total Deduction
        */

        let totalDeduction =
            pf + tax;


        /*
            Calculate Net Salary
        */

        let netSalary =
            grossSalary -
            totalDeduction;


        /*
            Store salary information
        */

        let salaryData = {

            name: name,

            employeeId: employeeId,

            department: department,

            month: month,

            basicSalary: basicSalary.toFixed(2),

            hra: hra.toFixed(2),

            allowance: allowance.toFixed(2),

            bonus: bonus.toFixed(2),

            other: other.toFixed(2),

            grossSalary: grossSalary.toFixed(2),

            pf: pf.toFixed(2),

            tax: tax.toFixed(2),

            totalDeduction:
                totalDeduction.toFixed(2),

            netSalary:
                netSalary.toFixed(2)

        };


        localStorage.setItem(

            "employeeSalary",

            JSON.stringify(salaryData)

        );


        /*
            Open Page 2
        */

        window.location.href =
            "salary-success.html";


    });


</script>


</body>

</html>
