<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Processing System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3e5f5;
        }

        .container {
            width: 850px;
            max-width: 90%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.20);
        }

        h2 {
            text-align: center;
            color: #6a1b9a;
            margin-bottom: 25px;
        }

        .top-section {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .top-section div {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 9px;
            border: 1px solid #bbb;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .period-title {
            color: #6a1b9a;
            margin-top: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background-color: #6a1b9a;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        td:first-child {
            text-align: left;
        }

        .attendance-radio {
            width: auto;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 10px 25px;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4a126b;
        }

        #result {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.8;
        }

        .success {
            color: green;
        }

        @media screen and (max-width: 700px) {

            .top-section {
                display: block;
            }

            .top-section div {
                margin-bottom: 15px;
            }

            .container {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Attendance Processing System</h2>

    <div class="top-section">

        <div>
            <label>Date</label>
            <input type="date" id="date">
        </div>

        <div>
            <label>Class</label>
            <select id="className">
                <option value="">Select Class</option>
                <option>B.Sc CS - I Year</option>
                <option>B.Sc CS - II Year</option>
                <option>B.Sc CS - III Year</option>
                <option>BCA - I Year</option>
                <option>BCA - II Year</option>
            </select>
        </div>

        <div>
            <label>Period</label>
            <select id="period">
                <option value="">Select Period</option>
                <option value="1">Period 1</option>
                <option value="2">Period 2</option>
                <option value="3">Period 3</option>
                <option value="4">Period 4</option>
                <option value="5">Period 5</option>
            </select>
        </div>

    </div>

    <h3 class="period-title">Student Attendance</h3>

    <table>

        <tr>
            <th>Student Name</th>
            <th>Present</th>
            <th>Absent</th>
        </tr>

        <tr>
            <td>Arun Kumar</td>
            <td>
                <input class="attendance-radio"
                       type="radio"
                       name="student1"
                       value="Present">
            </td>
            <td>
                <input class="attendance-radio"
                       type="radio"
                       name="student1"
                       value="Absent">
            </td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>
                <input class="attendance-radio"
                       type="radio"
                       name="student2"
                       value="Present">
            </td>
            <td>
                <input class="attendance-radio"
                       type="radio"
                       name="student2"
                       value="Absent">
            </td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>
                <input class="attendance-radio"
                       type="radio"
                       name="student3"
                       value="Present">
            </td>
            <td>
                <input class="attendance-radio"
                       type="radio"
                       name="student3"
                       value="Absent">
            </td>
        </tr>

        <tr>
            <td>Divya</td>
            <td>
                <input class="attendance-radio"
                       type="radio"
                       name="student4"
                       value="Present">
            </td>
            <td>
                <input class="attendance-radio"
                       type="radio"
                       name="student4"
                       value="Absent">
            </td>
        </tr>

        <tr>
            <td>Karthik</td>
            <td>
                <input class="attendance-radio"
                       type="radio"
                       name="student5"
                       value="Present">
            </td>
            <td>
                <input class="attendance-radio"
                       type="radio"
                       name="student5"
                       value="Absent">
            </td>
        </tr>

    </table>

    <button onclick="saveAttendance()">
        Save Attendance
    </button>

    <div id="result"></div>

</div>


<script>

function saveAttendance() {

    let date = document.getElementById("date").value;
    let className = document.getElementById("className").value;
    let period = document.getElementById("period").value;

    let result = document.getElementById("result");

    if (date === "" || className === "" || period === "") {

        result.className = "";
        result.style.color = "red";

        result.innerHTML =
            "Please select Date, Class and Period.";

        return;
    }

    let students = [
        "student1",
        "student2",
        "student3",
        "student4",
        "student5"
    ];

    let present = 0;
    let absent = 0;
    let notMarked = 0;

    students.forEach(function(student) {

        let attendance =
            document.querySelector(
                'input[name="' + student + '"]:checked'
            );

        if (attendance) {

            if (attendance.value === "Present") {
                present++;
            } else {
                absent++;
            }

        } else {

            notMarked++;
        }

    });

    if (notMarked > 0) {

        result.style.color = "red";

        result.innerHTML =
            "Please mark attendance for all students.";

        return;
    }

    result.className = "success";

    result.innerHTML =
        "Attendance Saved Successfully!<br><br>" +
        "Date : " + date + "<br>" +
        "Class : " + className + "<br>" +
        "Period : " + period + "<br>" +
        "Present : " + present + "<br>" +
        "Absent : " + absent;

}

</script>

</body>
</html>
