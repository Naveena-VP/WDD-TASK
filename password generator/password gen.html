<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0eafa;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: auto;
            background-color: #68458c;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 70px;
            font-size: 32px;
        }

        h1 {
            text-align: center;
            color: #68458c;
            margin-top: 20px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            color: #68458c;
            border-bottom: 2px solid #d9cbea;
            padding-bottom: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input[type="number"] {
            width: 100%;
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            margin: 15px 0;
            padding: 10px;
            background-color: #f7f3fc;
            border-radius: 6px;
        }

        .checkbox input {
            width: 18px;
            height: 18px;
            margin-right: 10px;
        }

        .checkbox label {
            margin: 0;
            font-weight: normal;
        }

        .info {
            margin-top: 15px;
            padding: 13px;
            background-color: #f7f3fc;
            border-left: 4px solid #68458c;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #68458c;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #51366d;
        }

        #error {
            margin-top: 20px;
            padding: 15px;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            border-radius: 6px;
            display: none;
            line-height: 1.7;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="icon">
        🔐
    </div>


    <h1>
        Password Generator
    </h1>


    <p class="subtitle">
        Create a strong and secure password
    </p>


    <form id="passwordForm">


        <!-- Password Settings -->

        <div class="section">

            <h2>
                Password Settings
            </h2>


            <label>
                Password Length
            </label>

            <input
                type="number"
                id="length"
                min="6"
                max="30"
                value="12"
                placeholder="Enter password length"
            >


            <div class="checkbox">

                <input
                    type="checkbox"
                    id="uppercase"
                    checked
                >

                <label for="uppercase">
                    Include Uppercase Letters (A-Z)
                </label>

            </div>


            <div class="checkbox">

                <input
                    type="checkbox"
                    id="lowercase"
                    checked
                >

                <label for="lowercase">
                    Include Lowercase Letters (a-z)
                </label>

            </div>


            <div class="checkbox">

                <input
                    type="checkbox"
                    id="numbers"
                    checked
                >

                <label for="numbers">
                    Include Numbers (0-9)
                </label>

            </div>


            <div class="checkbox">

                <input
                    type="checkbox"
                    id="symbols"
                    checked
                >

                <label for="symbols">
                    Include Special Characters (!@#$)
                </label>

            </div>


            <div class="info">

                <strong>
                    Password Tip
                </strong>

                <br>

                Use a combination of uppercase letters,
                lowercase letters, numbers and special
                characters for a stronger password.

            </div>


        </div>


        <button type="submit">
            Generate Password
        </button>


    </form>


    <div id="error"></div>


</div>


<script>


    document.getElementById("passwordForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        let length =
            Number(
                document.getElementById("length").value
            );


        let uppercase =
            document.getElementById("uppercase").checked;


        let lowercase =
            document.getElementById("lowercase").checked;


        let numbers =
            document.getElementById("numbers").checked;


        let symbols =
            document.getElementById("symbols").checked;


        let errors = [];


        if (length < 6 || length > 30) {

            errors.push(
                "Password length must be between 6 and 30"
            );

        }


        if (
            !uppercase &&
            !lowercase &&
            !numbers &&
            !symbols
        ) {

            errors.push(
                "Select at least one character type"
            );

        }


        let errorBox =
            document.getElementById("error");


        if (errors.length > 0) {

            errorBox.style.display = "block";

            errorBox.innerHTML =
                "<strong>Please correct the following:</strong>" +
                "<br><br>" +
                errors.join("<br>");

            return;

        }


        /*
            Character sets
        */

        let upperChars =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        let lowerChars =
            "abcdefghijklmnopqrstuvwxyz";

        let numberChars =
            "0123456789";

        let symbolChars =
            "!@#$%^&*()_+-=[]{}|;:,.<>?";


        let characterSet = "";

        let password = "";


        /*
            Add selected character sets
        */

        if (uppercase) {

            characterSet += upperChars;

            password +=
                upperChars[
                    Math.floor(
                        Math.random() *
                        upperChars.length
                    )
                ];

        }


        if (lowercase) {

            characterSet += lowerChars;

            password +=
                lowerChars[
                    Math.floor(
                        Math.random() *
                        lowerChars.length
                    )
                ];

        }


        if (numbers) {

            characterSet += numberChars;

            password +=
                numberChars[
                    Math.floor(
                        Math.random() *
                        numberChars.length
                    )
                ];

        }


        if (symbols) {

            characterSet += symbolChars;

            password +=
                symbolChars[
                    Math.floor(
                        Math.random() *
                        symbolChars.length
                    )
                ];

        }


        /*
            Generate remaining characters
        */

        while (password.length < length) {

            password +=
                characterSet[
                    Math.floor(
                        Math.random() *
                        characterSet.length
                    )
                ];

        }


        /*
            Shuffle password
        */

        password =
            password
            .split("")
            .sort(
                () => Math.random() - 0.5
            )
            .join("");


        /*
            Calculate password strength
        */

        let strength = "";


        let score = 0;


        if (length >= 8) {

            score++;

        }


        if (length >= 12) {

            score++;

        }


        if (uppercase) {

            score++;

        }


        if (lowercase) {

            score++;

        }


        if (numbers) {

            score++;

        }


        if (symbols) {

            score++;

        }


        if (score <= 2) {

            strength = "Weak";

        }

        else if (score <= 4) {

            strength = "Medium";

        }

        else {

            strength = "Strong";

        }


        /*
            Store only the current
            generated password in memory
            for Page 2.
        */

        let passwordData = {

            password: password,

            length: length,

            uppercase: uppercase,

            lowercase: lowercase,

            numbers: numbers,

            symbols: symbols,

            strength: strength

        };


        sessionStorage.setItem(

            "generatedPassword",

            JSON.stringify(passwordData)

        );


        /*
            Open Page 2
        */

        window.location.href =
            "password-success.html";


    });


</script>


</body>

</html>
