<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Performance Evaluation System</title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eeeaf7;
        }


        .container {
            width: 750px;
            max-width: 90%;

            margin: 40px auto;

            background-color: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.15);
        }


        h1 {
            text-align: center;
            color: #654b8c;
            margin-bottom: 8px;
        }


        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }


        .section {
            margin-bottom: 25px;
        }


        .section h2 {
            color: #654b8c;

            border-bottom: 2px solid #d5c9e8;

            padding-bottom: 8px;
        }


        label {
            display: block;

            font-weight: bold;

            margin-top: 14px;

            margin-bottom: 6px;
        }


        input,
        select,
        textarea {
            width: 100%;

            padding: 10px;

            border: 1px solid #aaa;

            border-radius: 5px;

            box-sizing: border-box;

            font-family: Arial, sans-serif;
        }


        textarea {
            height: 80px;

            resize: none;
        }


        input:focus,
        select:focus,
        textarea:focus {
            outline: none;

            border-color: #654b8c;
        }


        .row {
            display: flex;

            gap: 20px;
        }


        .row div {
            flex: 1;
        }


        .rating-info {
            margin-top: 10px;

            padding: 10px;

            background-color: #f5f1fa;

            border-left: 4px solid #654b8c;

            color: #555;

            font-size: 14px;
        }


        button {
            display: block;

            margin: 25px auto 0;

            padding: 12px 30px;

            background-color: #654b8c;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 15px;

            cursor: pointer;
        }


        button:hover {
            background-color: #4e396d;
        }


        #error {
            margin-top: 20px;

            padding: 15px;

            background-color: #ffebee;

            color: #c62828;

            border: 1px solid #ef9a9a;

            border-radius: 6px;

            display: none;

            line-height: 1.7;
        }


        @media screen and (max-width: 600px) {

            .row {
                display: block;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Employee Performance Evaluation System
    </h1>


    <p class="subtitle">
        Evaluate employee performance and generate an evaluation report
    </p>


    <form id="evaluationForm">


        <!-- Employee Information -->

        <div class="section">


            <h2>Employee Information</h2>


            <div class="row">


                <div>

                    <label>
                        Employee Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter employee name"
                    >

                </div>


                <div>

                    <label>
                        Employee ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        placeholder="Example: EMP1001"
                    >

                </div>


            </div>


            <div class="row">


                <div>

                    <label>
                        Department
                    </label>

                    <select id="department">

                        <option value="">
                            Select Department
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="Human Resources">
                            Human Resources
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                        <option value="Sales">
                            Sales
                        </option>

                        <option value="Operations">
                            Operations
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Evaluation Period
                    </label>

                    <select id="period">

                        <option value="">
                            Select Period
                        </option>

                        <option value="January - March">
                            January - March
                        </option>

                        <option value="April - June">
                            April - June
                        </option>

                        <option value="July - September">
                            July - September
                        </option>

                        <option value="October - December">
                            October - December
                        </option>

                    </select>

                </div>


            </div>


        </div>


        <!-- Performance Evaluation -->

        <div class="section">


            <h2>
                Performance Evaluation
            </h2>


            <div class="rating-info">

                Rating Scale:
                <strong>1 = Poor</strong>,
                <strong>2 = Fair</strong>,
                <strong>3 = Good</strong>,
                <strong>4 = Very Good</strong>,
                <strong>5 = Excellent</strong>

            </div>


            <label>
                Quality of Work
            </label>

            <select id="quality">

                <option value="">
                    Select Rating
                </option>

                <option value="1">1 - Poor</option>

                <option value="2">2 - Fair</option>

                <option value="3">3 - Good</option>

                <option value="4">4 - Very Good</option>

                <option value="5">5 - Excellent</option>

            </select>


            <label>
                Productivity
            </label>

            <select id="productivity">

                <option value="">
                    Select Rating
                </option>

                <option value="1">1 - Poor</option>

                <option value="2">2 - Fair</option>

                <option value="3">3 - Good</option>

                <option value="4">4 - Very Good</option>

                <option value="5">5 - Excellent</option>

            </select>


            <label>
                Communication
            </label>

            <select id="communication">

                <option value="">
                    Select Rating
                </option>

                <option value="1">1 - Poor</option>

                <option value="2">2 - Fair</option>

                <option value="3">3 - Good</option>

                <option value="4">4 - Very Good</option>

                <option value="5">5 - Excellent</option>

            </select>


            <label>
                Teamwork
            </label>

            <select id="teamwork">

                <option value="">
                    Select Rating
                </option>

                <option value="1">1 - Poor</option>

                <option value="2">2 - Fair</option>

                <option value="3">3 - Good</option>

                <option value="4">4 - Very Good</option>

                <option value="5">5 - Excellent</option>

            </select>


            <label>
                Problem Solving
            </label>

            <select id="problemSolving">

                <option value="">
                    Select Rating
                </option>

                <option value="1">1 - Poor</option>

                <option value="2">2 - Fair</option>

                <option value="3">3 - Good</option>

                <option value="4">4 - Very Good</option>

                <option value="5">5 - Excellent</option>

            </select>


        </div>


        <!-- Comments -->

        <div class="section">


            <h2>
                Evaluation Comments
            </h2>


            <label>
                Manager Comments
            </label>


            <textarea
                id="comments"
                placeholder="Enter evaluation comments"
            ></textarea>


        </div>


        <button type="submit">
            Submit Evaluation
        </button>


    </form>


    <div id="error"></div>


</div>


<script>


    document.getElementById("evaluationForm")
    .addEventListener("submit", function(event) {


        event.preventDefault();


        let name =
            document.getElementById("name")
            .value.trim();


        let employeeId =
            document.getElementById("employeeId")
            .value.trim();


        let department =
            document.getElementById("department")
            .value;


        let period =
            document.getElementById("period")
            .value;


        let quality =
            document.getElementById("quality")
            .value;


        let productivity =
            document.getElementById("productivity")
            .value;


        let communication =
            document.getElementById("communication")
            .value;


        let teamwork =
            document.getElementById("teamwork")
            .value;


        let problemSolving =
            document.getElementById("problemSolving")
            .value;


        let comments =
            document.getElementById("comments")
            .value.trim();


        let errors = [];


        if (name === "") {

            errors.push(
                "Enter employee name"
            );

        }


        if (employeeId === "") {

            errors.push(
                "Enter employee ID"
            );

        }


        if (department === "") {

            errors.push(
                "Select department"
            );

        }


        if (period === "") {

            errors.push(
                "Select evaluation period"
            );

        }


        if (quality === "") {

            errors.push(
                "Select Quality of Work rating"
            );

        }


        if (productivity === "") {

            errors.push(
                "Select Productivity rating"
            );

        }


        if (communication === "") {

            errors.push(
                "Select Communication rating"
            );

        }


        if (teamwork === "") {

            errors.push(
                "Select Teamwork rating"
            );

        }


        if (problemSolving === "") {

            errors.push(
                "Select Problem Solving rating"
            );

        }


        if (comments === "") {

            errors.push(
                "Enter manager comments"
            );

        }


        let errorBox =
            document.getElementById("error");


        if (errors.length > 0) {

            errorBox.style.display = "block";

            errorBox.innerHTML =

                "<strong>Please correct the following:</strong>" +

                "<br><br>" +

                errors.join("<br>");

            return;

        }


        /*
            Calculate Total Score
        */

        let totalScore =

            Number(quality) +

            Number(productivity) +

            Number(communication) +

            Number(teamwork) +

            Number(problemSolving);


        /*
            Calculate Average
        */

        let average =
            totalScore / 5;


        /*
            Determine Performance Grade
        */

        let grade;


        if (average >= 4.5) {

            grade = "Excellent";

        }

        else if (average >= 3.5) {

            grade = "Very Good";

        }

        else if (average >= 2.5) {

            grade = "Good";

        }

        else if (average >= 1.5) {

            grade = "Fair";

        }

        else {

            grade = "Poor";

        }


        /*
            Store evaluation information
        */

        let evaluationData = {

            name: name,

            employeeId: employeeId,

            department: department,

            period: period,

            quality: quality,

            productivity: productivity,

            communication: communication,

            teamwork: teamwork,

            problemSolving: problemSolving,

            comments: comments,

            totalScore: totalScore,

            average: average.toFixed(2),

            grade: grade

        };


        localStorage.setItem(

            "employeeEvaluation",

            JSON.stringify(evaluationData)

        );


        /*
            Open Page 2
        */

        window.location.href =
            "evaluation-success.html";


    });


</script>


</body>

</html>
