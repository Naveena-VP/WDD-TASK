<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Validation System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3e5f5;
        }

        .container {
            width: 420px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.20);
        }

        h2 {
            text-align: center;
            color: #6a1b9a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 14px;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 9px;
            border: 1px solid #bbb;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .gender {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .gender label {
            font-weight: normal;
            margin-top: 0;
        }

        .gender input {
            width: auto;
        }

        .documents {
            margin-top: 15px;
        }

        .documents label {
            font-weight: normal;
            margin-top: 8px;
        }

        .documents input {
            width: auto;
            margin-right: 5px;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 9px 20px;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4a126b;
        }

        #result {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.7;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Applicant Validation System</h2>

        <form id="validationForm">

            <label>Applicant Name</label>
            <input type="text" id="name" placeholder="Enter applicant name">

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter email">

            <label>Phone</label>
            <input type="tel" id="phone" placeholder="Enter phone number">

            <label>Date of Birth</label>
            <input type="date" id="dob">

            <label>Course</label>
            <select id="course">
                <option value="">Select Course</option>
                <option value="B.Com">B.Com</option>
                <option value="B.Sc Computer Science">B.Sc Computer Science</option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="BA English">BA English</option>
            </select>

            <label>Gender</label>

            <div class="gender">
                <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>
            </div>

            <label>Marks / Percentage</label>
            <input type="number" id="marks"
                   placeholder="Enter percentage"
                   min="0" max="100">

            <div class="documents">

                <label>Documents</label>

                <label>
                    <input type="checkbox" id="marksheet">
                    Marksheet
                </label>

                <label>
                    <input type="checkbox" id="idproof">
                    ID Proof
                </label>

                <label>
                    <input type="checkbox" id="certificate">
                    Transfer Certificate
                </label>

            </div>

            <button type="submit">Validate Applicant</button>

        </form>

        <div id="result"></div>

    </div>


    <script>

        document.getElementById("validationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let dob = document.getElementById("dob").value;
            let course = document.getElementById("course").value;
            let marks = document.getElementById("marks").value;

            let gender = document.querySelector(
                'input[name="gender"]:checked'
            );

            let marksheet =
                document.getElementById("marksheet").checked;

            let idproof =
                document.getElementById("idproof").checked;

            let certificate =
                document.getElementById("certificate").checked;

            let result = document.getElementById("result");

            let errors = [];

            if (name === "") {
                errors.push("Enter applicant name");
            }

            if (email === "") {
                errors.push("Enter email");
            }

            if (phone.length !== 10) {
                errors.push("Enter valid 10 digit phone number");
            }

            if (dob === "") {
                errors.push("Select date of birth");
            }

            if (course === "") {
                errors.push("Select a course");
            }

            if (!gender) {
                errors.push("Select gender");
            }

            if (marks === "" || Number(marks) < 50) {
                errors.push("Minimum 50% marks required");
            }

            if (!marksheet) {
                errors.push("Marksheet is required");
            }

            if (!idproof) {
                errors.push("ID Proof is required");
            }

            if (!certificate) {
                errors.push("Transfer Certificate is required");
            }


            if (errors.length === 0) {

                result.className = "success";

                result.innerHTML =
                    "Applicant Validation Successful<br>" +
                    "Name : " + name + "<br>" +
                    "Email : " + email + "<br>" +
                    "Phone : " + phone + "<br>" +
                    "Course : " + course + "<br>" +
                    "Status : Valid Applicant";

            } else {

                result.className = "error";

                result.innerHTML =
                    "Applicant Validation Failed<br><br>" +
                    errors.join("<br>");

            }

        });

    </script>

</body>
</html>
